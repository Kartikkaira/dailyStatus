version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: day_status_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: day_status_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d day_status_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
